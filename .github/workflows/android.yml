name: Build Android app (Ludo Hub)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        working-directory: android-app
        run: npm install

      - name: Create the Android project
        working-directory: android-app
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          npm run copy-web
          npx cap add android
          node patch-android.js
          npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoHub-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/ludo-hub.apk
